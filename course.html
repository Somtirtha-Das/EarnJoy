<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Learn courses, lectures and study resources on EarnJoy.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://earnjoy.das105070.workers.dev/course.html">

    <meta property="og:title" content="Course | EarnJoy">
    <meta property="og:description" content="Learn courses, lectures and study resources on EarnJoy.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://earnjoy.das105070.workers.dev/course.html">
    <meta property="og:image" content="https://earnjoy.das105070.workers.dev/Logo.png">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Course | EarnJoy">
    <meta name="twitter:description" content="Learn courses, lectures and study resources on EarnJoy.">
    <meta name="twitter:image" content="https://earnjoy.das105070.workers.dev/Logo.png">

    <title>Course | EarnJoy</title>

    <script id="courseStructuredData" type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Course",
        "name": "Course | EarnJoy",
        "description": "Learn courses, lectures and study resources on EarnJoy.",
        "provider": {
            "@type": "Organization",
            "name": "EarnJoy",
            "url": "https://earnjoy.das105070.workers.dev/"
        }
    }
    </script>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Logo.png">
</head>

<body>

<header class="header">
    <div class="header-container">
        <a href="index.html" class="brand" aria-label="EarnJoy home">
            <img src="Logo.png" alt="EarnJoy Logo" class="logo">
            <div class="brand-text">
                <span class="brand-name">EarnJoy</span>
                <span class="brand-tagline">Earning with Enjoy</span>
            </div>
        </a>

        <a href="https://www.youtube.com/@EarnJoyOfficial"
            class="youtube-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Watch EarnJoy lectures on YouTube">
            <span class="youtube-icon" aria-hidden="true">▶</span>
            <span class="youtube-label">Watch Lectures on YouTube</span>
        </a>
    </div>
</header>

<main class="course-page">
    <div id="courseDetails" class="course-page-container">
        <div class="loading-state">Loading course...</div>
    </div>
</main>

<footer class="footer">
    <div class="footer-container">
        <h2>EarnJoy</h2>
        <p>Earning with Enjoy</p>
        <p class="footer-description">Free courses, lectures and study resources.</p>
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
        </nav>
        <div class="footer-line"></div>
        <p class="copyright">© <span id="currentYear"></span> EarnJoy. All Rights Reserved.</p>
    </div>
</footer>

<script>
let courses = [];

async function loadCourse() {
    const container = document.getElementById("courseDetails");

    try {
        const response = await fetch("courses.json?v=" + Date.now(), {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Unable to load courses.");
        }

        const data = await response.json();
        courses = Array.isArray(data.courses) ? data.courses : [];

        const params = new URLSearchParams(window.location.search);
        const courseId = params.get("id");
        const selectedCourse = courses.find(item => item.id === courseId);

        if (!selectedCourse) {
            container.innerHTML = [
                '<div class="no-results">',
                '<div class="no-results-icon">⚠️</div>',
                '<h1>Course not found</h1>',
                '<p>The course you requested could not be found.</p>',
                '<a class="back-button" href="index.html">← Back to Courses</a>',
                '</div>'
            ].join("");
            return;
        }

        updateCourseSEO(selectedCourse);
        displayCourse(selectedCourse);
    } catch (error) {
        console.error(error);
        container.innerHTML = [
            '<div class="no-results">',
            '<div class="no-results-icon">⚠️</div>',
            '<h1>Unable to load course</h1>',
            '<p>Please try refreshing the page.</p>',
            '<a class="back-button" href="index.html">← Back to Courses</a>',
            '</div>'
        ].join("");
    }
}

function updateCourseSEO(course) {
    const courseName = course.name || "Course";
    const courseDescription = course.description || "Learn courses, lectures and study resources on EarnJoy.";
    const pageUrl = window.location.href.split("#")[0];
    const imageUrl = new URL(course.image || "Logo.png", window.location.href).href;
    const title = courseName + " Course | EarnJoy";

    document.title = title;

    const descriptionMeta = document.querySelector('meta[name="description"]');
    const canonical = document.querySelector('link[rel="canonical"]');
    const ogTitle = document.querySelector('meta[property="og:title"]');
    const ogDescription = document.querySelector('meta[property="og:description"]');
    const ogUrl = document.querySelector('meta[property="og:url"]');
    const ogImage = document.querySelector('meta[property="og:image"]');
    const twitterTitle = document.querySelector('meta[name="twitter:title"]');
    const twitterDescription = document.querySelector('meta[name="twitter:description"]');
    const twitterImage = document.querySelector('meta[name="twitter:image"]');

    if (descriptionMeta) descriptionMeta.setAttribute("content", courseDescription);
    if (canonical) canonical.setAttribute("href", pageUrl);
    if (ogTitle) ogTitle.setAttribute("content", title);
    if (ogDescription) ogDescription.setAttribute("content", courseDescription);
    if (ogUrl) ogUrl.setAttribute("content", pageUrl);
    if (ogImage) ogImage.setAttribute("content", imageUrl);
    if (twitterTitle) twitterTitle.setAttribute("content", title);
    if (twitterDescription) twitterDescription.setAttribute("content", courseDescription);
    if (twitterImage) twitterImage.setAttribute("content", imageUrl);

    const structuredData = document.getElementById("courseStructuredData");
    if (structuredData) {
        structuredData.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "Course",
            "name": courseName,
            "description": courseDescription,
            "provider": {
                "@type": "Organization",
                "name": "EarnJoy",
                "url": "https://earnjoy.das105070.workers.dev/"
            },
            "url": pageUrl,
            "image": imageUrl,
            "hasCourseInstance": {
                "@type": "CourseInstance",
                "courseMode": "online",
                "courseWorkload": course.duration || "Self-paced"
            }
        });
    }
}

function displayCourse(course) {
    const container = document.getElementById("courseDetails");
    const materials = Array.isArray(course.materials) ? course.materials : [];

    const level = course.level || "Beginner";
    const duration = course.duration || (materials.length ? materials.length + " lessons" : "Self-paced");
    const language = course.language || "English";
    const category = course.category || "General";

    const materialsHTML = materials.map(function(material, index) {
        const title = material.title || ("Study Material " + (index + 1));
        const pdf = encodeURI(material.pdf || "#");

        return [
            '<article class="material-item">',
            '<div class="material-number" aria-hidden="true">' + (index + 1) + '</div>',
            '<div class="material-title">',
            '<h3>' + escapeHTML(title) + '</h3>',
            '</div>',
            '<div class="material-actions">',
            '<a href="' + pdf + '" class="btn btn-read" target="_blank" rel="noopener noreferrer">Read PDF</a>',
            '</div>',
            '</article>'
        ].join("");
    }).join("");

    container.innerHTML = [
        '<a href="index.html" class="back-button">← Back to Courses</a>',
        '<section class="course-overview" aria-labelledby="courseTitle">',
        '<div class="course-overview-media">',
        '<img src="' + escapeAttribute(course.image || "Logo.png") + '" alt="' + escapeAttribute(course.name || "Course") + '" class="course-page-image" loading="eager">',
        '</div>',
        '<div class="course-page-info">',
        '<div class="course-page-provider">',
        '<img src="Logo.png" alt="EarnJoy">',
        '<span>EarnJoy</span>',
        '</div>',
        '<span class="course-category">' + escapeHTML(category) + '</span>',
        '<h1 id="courseTitle">' + escapeHTML(course.name || "Course") + '</h1>',
        '<p class="course-page-description">' + escapeHTML(course.description || "") + '</p>',
        '<div class="course-facts">',
        '<span><strong>Level</strong>' + escapeHTML(level) + '</span>',
        '<span><strong>Duration</strong>' + escapeHTML(duration) + '</span>',
        '<span><strong>Language</strong>' + escapeHTML(language) + '</span>',
        '</div>',
        '<div class="course-material-count">📄 ' + materials.length + ' ' + (materials.length === 1 ? "Study Material" : "Study Materials") + '</div>',
        '</div>',
        '</section>',
        '<section class="course-materials" aria-labelledby="curriculumHeading">',
        '<div class="course-materials-header">',
        '<div>',
        '<span class="section-kicker">COURSE CURRICULUM</span>',
        '<h2 id="curriculumHeading">Learn at your own pace</h2>',
        '<p>Access all lectures and study materials from this course.</p>',
        '</div>',
        '</div>',
        '<div class="material-list">' + materialsHTML + '</div>',
        '</section>'
    ].join("");
}

function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
    return escapeHTML(value);
}

document.getElementById("currentYear").textContent = new Date().getFullYear();
loadCourse();
</script>

</body>
</html>
